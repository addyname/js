<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Protein Calculator (Based on Height & Gender)</title>
  <link rel="stylesheet" href="calculator.css">
</head>
<body>
  <nav>
      <a href="https://addyname.github.io/js/07_project/home.html" aria-current="page">Home</a>
    </nav>

  <h2>Protein Calculator</h2>
<form>
  <label for="gender">Gender:</label>
  <select id="gender">
    <option value="male">Male</option>
    <option value="female">Female</option>
  </select>

  <label for="activity">Training Intensity:</label>
<select id="activity">
  <option value="no-training">No Training</option>
  <option value="light">Light</option>
  <option value="medium">Medium</option>
  <option value="hard">Hard</option>
</select>

  <label for="height">Height (cm):</label>
  <input type="text" id="height" placeholder="Enter your height in cm" />

  <label for="weight">Weight (kg):</label>
  <input type="text" id="weight" placeholder="Enter your weight in kg" />

  <button>Calculate Protein</button>
  </form>

  <div id="result"></div>
  <script src="calculator.js"></script>
</body>
</html>
