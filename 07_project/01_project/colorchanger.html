<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript Background Color Switcher</title>
  <link rel="stylesheet" href="colorchanger.css">
</head>
<body>
  <div class="canvas">
    <h1 class="change-color">Color Scheme Switcher</h1>
    <span class="button" id="grey"></span>
    <span class="button" id="green"></span>
    <span class="button" id="blue"></span>
    <span class="button" id="yellow"></span>
    <h2 class="change-color">
      Try clicking on one of the colors above
      to change the background color of this page!
    </h2>
    <button class="reset-color" id="reset">Reset Color</button>
    <button class="reset-color" id="text-color">Change Text Color</button>
  </div>
  <script src="colorchanger.js"></script>
</body>
</html>
