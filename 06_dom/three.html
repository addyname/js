<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Element</title>
</head>
<body style="background-color: #212121; color: #fff;">
    <ul class="create-name">
        <li>Adnan</li>
    </ul>
</body>
<script>
    const div = document.createElement('div')
    console.log(div);
    div.className = 'main'
    div.id = Math.floor(Math.random() * 10 + 1)
    div.setAttribute('title', 'generate')
    div.style.backgroundColor = "red"
    const addText = document.createTextNode('Adnan Ahmad')
    div.appendChild(addText)
    document.body.appendChild(div)
    // ------------------------//
    const bgColors = ['Red', 'Green', 'Blue']
    function getBgColors () {
        randomColor = Math.floor(Math.random() * bgColors.length)
        return bgColors[randomColor]
    }
    
    const lastName = document.createElement('li')
    const addLastName = document.createTextNode('Ahmad')
    lastName.id = Math.floor(Math.random()*10 + 1)
    lastName.style.backgroundColor = getBgColors()
    lastName.appendChild(addLastName)
    document.querySelector('.create-name').appendChild(lastName);
</script>
</html>
